<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0405"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#red)" stroke-width="6" opacity="0.3"/>
  <g stroke="url(#red)" stroke-width="24" stroke-linecap="round" filter="url(#glow)">
    <line x1="140" y1="140" x2="372" y2="372" />
    <line x1="372" y1="140" x2="140" y2="372" />
  </g>
  <path d="M 256 180 C 256 180, 210 280, 256 330 C 302 280, 256 180, 256 180 Z" fill="#dc2626" filter="url(#glow)"/>
</svg>

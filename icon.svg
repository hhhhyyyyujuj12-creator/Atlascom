<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- خلفية سوداء عميقة جداً -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- موجة حمراء فخمة -->
    <linearGradient id="waveRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>

    <!-- موجة سوداء عميقة (للتداخل) -->
    <linearGradient id="waveDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#150a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- تدرج لمعان زجاجي من الأعلى -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- فلتر التوهج للخلفية -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. قاعدة التطبيق -->
  <rect width="512" height="512" rx="115" fill="url(#bgBase)"/>

  <!-- 2. توهج خلفي خافت (يعطي عمق) -->
  <circle cx="256" cy="256" r="200" fill="#e11d48" opacity="0.1" filter="url(#glow)"/>

  <!-- 3. الموجة السوداء (الخلفية) -->
  <path d="M 0 200 C 150 150, 300 350, 512 250 L 512 512 L 0 512 Z" fill="url(#waveDark)"/>

  <!-- 4. الموجة الحمراء الفخمة (الأمامية) -->
  <path d="M -50 250 C 150 100, 400 450, 550 200 L 550 550 L -50 550 Z" fill="url(#waveRed)"/>
  
  <!-- 5. خط ضوئي رفيع يحدد حواف الموجة (يعطي إحساس بالزجاج) -->
  <path d="M -50 250 C 150 100, 400 450, 550 200" fill="none" stroke="#ff4d4d" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  
  <!-- 6. انعكاس الإضاءة الزجاجية العلوي (Glossy effect) -->
  <rect width="512" height="512" rx="115" fill="url(#glassGlare)"/>

  <!-- 7. إطار خارجي خفيف جداً (مثل شاشات الآيفون) -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08"/>
</svg>

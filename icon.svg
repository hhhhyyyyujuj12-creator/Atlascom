<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a080b"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- درع خارجي -->
  <path d="M 256 40 L 440 110 L 440 280 C 440 420, 256 480, 256 480 C 256 480, 72 420, 72 280 L 72 110 Z" fill="none" stroke="#dc2626" stroke-width="12" filter="url(#glow)" opacity="0.6"/>
  
  <!-- قطرة الدم -->
  <path d="M 256 120 C 256 120, 150 250, 256 380 C 362 250, 256 120, 256 120 Z" fill="url(#bloodGrad)" opacity="0.9"/>
  
  <!-- الخنجر -->
  <path d="M 256 160 L 276 280 L 256 310 L 236 280 Z" fill="url(#bladeGrad)"/>
  <rect x="210" y="280" width="92" height="16" rx="8" fill="#e5e7eb"/>
  <rect x="220" y="285" width="72" height="6" rx="3" fill="#dc2626"/>
  <rect x="246" y="296" width="20" height="50" rx="6" fill="#1f2937"/>
  <circle cx="256" cy="356" r="16" fill="#e5e7eb"/>
  <circle cx="256" cy="356" r="8" fill="#dc2626" filter="url(#glow)"/>
  
  <!-- تطاير دم -->
  <circle cx="200" cy="410" r="8" fill="#dc2626" filter="url(#glow)"/>
  <circle cx="320" cy="390" r="6" fill="#dc2626" filter="url(#glow)"/>
  <circle cx="180" cy="330" r="4" fill="#dc2626"/>
  <circle cx="340" cy="310" r="5" fill="#dc2626"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- خلفية سوداء مرعبة مع توهج أحمر -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0a0d"/>
      <stop offset="60%" stop-color="#0a0405"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- تدرج النص الأبيض المعدني (تيم) -->
    <linearGradient id="metalText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>

    <!-- تدرج النص الدموي (الثار) -->
    <linearGradient id="bloodText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- فلتر التوهج الأحمر للنص -->
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. خلفية الأيقونة -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  
  <!-- 2. خطوط خدوش خلفية (تعطي طابع رعب ورهبة) -->
  <g stroke="#dc2626" stroke-width="2" opacity="0.15">
    <line x1="50" y1="100" x2="200" y2="150" />
    <line x1="300" y1="450" x2="480" y2="380" />
    <line x1="80" y1="400" x2="180" y2="350" />
    <line x1="400" y1="80" x2="350" y2="180" />
  </g>

  <!-- 3. كلمة "تيم" (في الأعلى، ضخمة، معدنية متوهجة) -->
  <text x="256" y="230" 
        font-family="'Cairo', 'Tahoma', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="160" 
        fill="url(#metalText)" 
        text-anchor="middle" 
        letter-spacing="-2"
        filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.8))">
    تيم
  </text>

  <!-- 4. كلمة "الثار" (في المنتصف/الأسفل، دموية ومرعبة) -->
  <text x="256" y="340" 
        font-family="'Cairo', 'Tahoma', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="95" 
        fill="url(#bloodText)" 
        text-anchor="middle"
        filter="url(#redGlow)">
    الثار
  </text>

  <!-- 5. خط فاصل رفيع تحت الكلمة (يعطي ثبات للتصميم) -->
  <line x1="120" y1="380" x2="392" y2="380" stroke="#dc2626" stroke-width="4" opacity="0.6" filter="url(#redGlow)"/>
  
  <!-- 6. إطار خفيف جداً للأيقونة -->
  <rect x="4" y="4" width="504" height="504" rx="111" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- خلفية داكنة مع توهج خفيف -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>
    <!-- توهج أحمر لكلمة الثار -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- خلفية التطبيق -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- إطار خارجي أحمر خافت -->
  <rect x="15" y="15" width="482" height="482" rx="85" fill="none" stroke="#7f1d1d" stroke-width="3" opacity="0.6"/>

  <!-- كلمة "تيم" (فوق - أبيض معدني واضح) -->
  <text x="256" y="240" 
        font-family="Tahoma, Arial, sans-serif" 
        font-weight="900" 
        font-size="170" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-2">
    تيم
  </text>

  <!-- كلمة "الثار" (تحت - أحمر دموي متوهج) -->
  <text x="256" y="350" 
        font-family="Tahoma, Arial, sans-serif" 
        font-weight="900" 
        font-size="100" 
        fill="#dc2626" 
        text-anchor="middle"
        filter="url(#glow)">
    الثار
  </text>

  <!-- خط فاصل ناري -->
  <line x1="120" y1="380" x2="392" y2="380" stroke="#991b1b" stroke-width="5" opacity="0.8" filter="url(#glow)"/>
</svg>
